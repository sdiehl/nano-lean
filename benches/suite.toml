# Benches for `cargo bench --bench kernel`. Paths are relative to this file.
#
# kind = "all"     every declaration in order on one session, as `nl-fast -j 1` checks
# kind = "target"  one declaration on a fresh session: `declaration`, else the last one
# kind = "import"  decoding the export into a store
#
# micro/ is committed. fixtures/ is filled by benches/fixtures.sh.

[[bench]]
name = "micro/church"
file = "micro/church.ltc"
kind = "all"
reps = 20

