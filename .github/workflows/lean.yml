# Downstream Lean projects from the README, each pinned to its own toolchain.
# Disabled until nano-lean supports those Lean versions. To enable, remove
# `if: false`, add `push:` under `on`, and drop unsupported matrix entries.

name: Lean projects

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: ${{ matrix.project }} (Lean ${{ matrix.lean }})
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: navier-stokes-euler
            repository: openai/NavierStokesAndEuler
            ref: f9e8bc5b38b6e212696e8a30e3e91517af887bbd
            root: .
            lean: 4.34.0-rc2
            modules: NavierStokes.ComparatorSolution Euler.Solution
          - project: cslib
            repository: leanprover/cslib
            ref: cd48dc2ae0e13e563d5f7085b19e170c5c273eb2
            root: .
            lean: 4.35.0-rc4
            modules: Cslib
          - project: quasi-riemann
            repository: openai/math
            ref: fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
            root: lean
            lean: 4.34.1
            modules: ComparatorChallenges.QuasiRiemannHypothesis
          - project: erdos-reciprocal
            repository: openai/math
            ref: fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
            root: lean
            lean: 4.34.1
            modules: ComparatorChallenges.ErdosReciprocal
    env:
      CARGO_BUILD_JOBS: 2
      EXPORTER_VERSION: 0.2.0
      LEAN_VERSION: ${{ matrix.lean }}
      MODULES: ${{ matrix.modules }}
      PROJECT: .ci/${{ matrix.project }}/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --release --locked --bin nl-fast
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .ci/${{ matrix.project }}
      - name: Check the project pins the matrix toolchain
        run: test "$(cat "$PROJECT/lean-toolchain")" = "leanprover/lean4:v$LEAN_VERSION"
      - uses: leanprover/lean-action@v1.6.1
        with:
          lake-package-directory: ${{ env.PROJECT }}
          auto-config: false
          use-github-cache: false
      - name: Export and check
        run: |
          sudo systemd-run --unit=nano-project-check --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv="LEAN_VERSION=$LEAN_VERSION" --setenv="MODULES=$MODULES" \
            --setenv="PROJECT=$PROJECT" --setenv="EXPORTER_VERSION=$EXPORTER_VERSION" \
            --property=MemoryMax=14G --property=MemorySwapMax=0 \
            --property=OOMPolicy=kill --property=RuntimeMaxSec=5400 \
            bash -euxo pipefail <<'RUN'
          root=$PWD
          cargo install olean-export --version "=$EXPORTER_VERSION" --locked -j 2 \
            --root "$root/.ci/exporter"
          cd "$PROJECT"
          lake build $MODULES
          lake env "$root/.ci/exporter/bin/olean-export" $MODULES -j 2 -o "$root/.ci/project.ndjson"
          "$root/target/release/nl-fast" "$root/.ci/project.ndjson" --trace
          RUN
