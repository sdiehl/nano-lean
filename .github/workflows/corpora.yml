name: Standard library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.corpus }} (Lean ${{ matrix.lean }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lean: ["4.34.1"]
        corpus: [init-prelude, init, std]
        include:
          - corpus: init-prelude
            module: Init.Prelude
          - corpus: init
            module: Init
          - corpus: std
            module: Std
          - lean: "4.34.1"
            githash: 5045d0056413266e57c625dcd7c365b10e377c52
            format: "3.1.0"
            exporter: "0.1.0"
          # Expected declaration names, pinned per Lean version and corpus.
          - lean: "4.34.1"
            corpus: init-prelude
            declarations: 2106
            coverage: a6085bdbb8b9d6507f309e3c3fe567baba2806425be6e25f884b7ed28082f16b
          - lean: "4.34.1"
            corpus: init
            declarations: 59626
            coverage: 57d65adc8c42b881e677f9a5319f9950b26d064b8fd6f214e783119ea1dd9063
          - lean: "4.34.1"
            corpus: std
            declarations: 100829
            coverage: cae9e2c520253e1f4bbacf5c3d6145e31b5d40c346b68962c4cc0d48589cc118
    env:
      CARGO_BUILD_JOBS: 2
      CORPUS: ${{ matrix.corpus }}
      MODULE: ${{ matrix.module }}
      LEAN_VERSION: ${{ matrix.lean }}
      LEAN_GITHASH: ${{ matrix.githash }}
      EXPORT_FORMAT: ${{ matrix.format }}
      EXPORTER_VERSION: ${{ matrix.exporter }}
      DECLARATIONS: ${{ matrix.declarations }}
      COVERAGE: ${{ matrix.coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release checker
        run: cargo build --release --locked --bin nl-fast
      - uses: actions/cache/restore@v4
        id: export
        with:
          path: |
            .ci/${{ matrix.corpus }}.ndjson
            .ci/${{ matrix.corpus }}.ndjson.sha256
          key: corpus-export-v1-${{ runner.os }}-${{ matrix.corpus }}-lean-${{ matrix.lean }}-olean-export-${{ matrix.exporter }}
      - name: Generate pinned export
        if: steps.export.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          started=$SECONDS
          progress() {
            while sleep 10; do
              echo "[progress] preparing $CORPUS; elapsed $(( (SECONDS - started) / 60 ))m $(( (SECONDS - started) % 60 ))s"
            done
          }
          progress &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true; wait "$progress_pid" 2>/dev/null || true' EXIT
          trap 'sudo systemctl stop nano-mathlib-export.service || true; exit 130' INT TERM
          bash .github/scripts/mathlib-ci.sh prepare "$CORPUS"
      - name: Verify export checksum and coverage
        id: verify
        run: bash .github/scripts/mathlib-ci.sh verify "$CORPUS"
      - name: Save verified export before checking
        if: always() && steps.verify.outcome == 'success' && steps.export.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/${{ matrix.corpus }}.ndjson
            .ci/${{ matrix.corpus }}.ndjson.sha256
          key: ${{ steps.export.outputs.cache-primary-key }}
      - name: Check every declaration
        timeout-minutes: 15
        run: bash .github/scripts/mathlib-ci.sh check "$CORPUS"
      - name: Report result
        if: always()
        run: |
          {
            echo "### $CORPUS, Lean $LEAN_VERSION"
            echo 'One worker; 100M steps and 256 MiB arena per declaration; 11 GiB OS limit.'
            echo '```text'
            cat ".ci/$CORPUS-report/summary.txt" 2>/dev/null || true
            tail -n 3 ".ci/$CORPUS-report/trace.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.corpus }}-lean-${{ matrix.lean }}-${{ github.sha }}
          path: .ci/${{ matrix.corpus }}-report/
          if-no-files-found: warn
          retention-days: 14
