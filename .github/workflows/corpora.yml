name: Standard library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.corpus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        corpus: [init-prelude, init, std]
    env:
      CARGO_BUILD_JOBS: 2
      CORPUS: ${{ matrix.corpus }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release checker
        run: cargo build --release --locked --example nl
      - uses: actions/cache/restore@v4
        id: export
        with:
          path: |
            .ci/${{ matrix.corpus }}.ndjson
            .ci/${{ matrix.corpus }}.ndjson.sha256
          key: corpus-export-v1-${{ runner.os }}-${{ matrix.corpus }}-lean-4.34.1-olean-export-0.1.0
      - name: Generate pinned export
        if: steps.export.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          started=$SECONDS
          progress() {
            while sleep 10; do
              echo "[progress] preparing $CORPUS; elapsed $(( (SECONDS - started) / 60 ))m $(( (SECONDS - started) % 60 ))s"
            done
          }
          progress &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true; wait "$progress_pid" 2>/dev/null || true' EXIT
          trap 'sudo systemctl stop nano-mathlib-export.service || true; exit 130' INT TERM
          bash .github/scripts/mathlib-ci.sh prepare "$CORPUS"
      - name: Verify export checksum and coverage
        id: verify
        run: bash .github/scripts/mathlib-ci.sh verify "$CORPUS"
      - name: Save verified export before checking
        if: always() && steps.verify.outcome == 'success' && steps.export.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/${{ matrix.corpus }}.ndjson
            .ci/${{ matrix.corpus }}.ndjson.sha256
          key: ${{ steps.export.outputs.cache-primary-key }}
      - name: Check every declaration
        timeout-minutes: 15
        run: bash .github/scripts/mathlib-ci.sh check "$CORPUS"
      - name: Report result
        if: always()
        run: |
          {
            echo "### $CORPUS — Lean 4.34.1"
            echo 'One worker; 100M steps and 256 MiB arena per declaration; 11 GiB OS limit.'
            echo '```text'
            cat ".ci/$CORPUS-report/result.json" ".ci/$CORPUS-report/time.txt" 2>/dev/null || true
            tail -n 3 ".ci/$CORPUS-report/trace.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.corpus }}-${{ github.sha }}
          path: .ci/${{ matrix.corpus }}-report/
          if-no-files-found: warn
          retention-days: 14

