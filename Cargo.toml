[package]
name = "nano-lean"
version = "0.1.0"
edition = "2024"
default-run = "nl-ref"
description = "A small dependent type checker built with unbound"
license = "MIT"

[[bin]]
name = "nl-ref"
path = "src/main.rs"

[features]
profile = []
vstats = []

[dependencies]
unbound = "0.4.0"
logos = "0.16"
lalrpop-util = "0.23.1"
offsides = "0.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
sha2 = "0.10.9"
num-bigint = "0.5.1"
num-traits = "0.2.19"
num-integer = "0.1.47"
stacker = "0.1.25"
rustc-hash = "2.1.3"
bumpalo = { version = "3.20.3", features = ["collections"] }
hashbrown = "0.17.1"
smallvec = { version = "1", features = ["union"] }
mimalloc = "0.1.52"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
indicatif = "0.18.6"
olean-export = "0.2.0"
memmap2 = "0.9.11"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
memchr = "2.8.3"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
deprecated-safe = "forbid"
future-incompatible = "deny"
keyword-idents = "forbid"
let-underscore = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
assigning_clones = "deny"
cloned_instead_of_copied = "deny"
enum_glob_use = "deny"
format_collect = "deny"
format_push_string = "deny"
manual_let_else = "deny"
needless_pass_by_value = "deny"
panic = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially_copy_pass_by_ref = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = 3
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
overflow-checks = true

[build-dependencies]
lalrpop = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
