[package]
name = "nano-lean"
version = "0.1.0"
edition = "2024"
default-run = "nl-ref"
description = "A small dependent type checker built with unbound"
license = "MIT"

[[bin]]
name = "nl-ref"
path = "src/main.rs"

[features]
profile = []
vstats = []

[dependencies]
unbound = { git = "https://github.com/sdiehl/unbound", rev = "133e29e3ef661a09cedb9b342eb306e136fb7122" }
logos = "0.16"
lalrpop-util = "0.23.1"
offsides = "0.2.1"
serde_json = "1"
sha2 = "0.10.9"
num-bigint = "0.5.1"
num-traits = "0.2.19"
num-integer = "0.1.47"
stacker = "0.1.25"
rustc-hash = "2.1.3"
bumpalo = { version = "3.20", features = ["collections"] }
hashbrown = "0.17"
smallvec = { version = "1", features = ["union"] }
mimalloc = "0.1"
indicatif = "0.18.4"

[build-dependencies]
lalrpop = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
